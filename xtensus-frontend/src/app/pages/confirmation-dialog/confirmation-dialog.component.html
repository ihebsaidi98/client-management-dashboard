<h2 mat-dialog-title>Confirmation</h2>
<div mat-dialog-content>
  Voulez-vous vraiment supprimer {{ personne.personneNom }} {{ personne.personnePrenom }}?
</div>
<div mat-dialog-actions>
  <button mat-button mat-dialog-close color="primary">Annuler</button>
  <button mat-button [mat-dialog-close]="true" color="warn">Supprimer</button>
</div>
