<div class="container">
  <h2 class="page-title">Ville </h2>

  <a mat-raised-button color="primary" class="custom-button" routerLink="/ajouter-ville">
    <mat-icon>add</mat-icon> Ajouter Ville
  </a>

  <!-- List of Villes -->
  <div class="table-responsive">
    <table datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-striped table-bordered">
      <thead class="thead-dark">
        <tr>
          <th>Nom</th>
          <th>Description</th>
          <th>gouvernorat</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ville of villes">
          <td>{{ ville.nom }}</td>
          <td>{{ ville.description }}</td>
          <td>{{ ville.gouvernorat?.nomg }}</td>

          <td>
            <div class="action-buttons">
              <button mat-raised-button class="btn btn-primary" (click)="openVilleDetailsPage(ville.villeId)">
                <i class="fa fa-eye"></i> Details
            </button>
              <button mat-raised-button class="btn btn-success" (click)="openUpdatePage(ville)">
                <i class="fa fa-edit"></i> Modifier
              </button>
              <button mat-raised-button class="btn btn-danger" (click)="openConfirmationDialog(ville)">
                <i class="fa fa-trash"></i> Supprimer
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
