<div class="form-container">
  <h2 class="form-title">Ajouter Ville</h2>
  <form [formGroup]="villeForm" (ngSubmit)="addVille()">
    <mat-form-field class="form-field" appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="nom">
      <mat-error *ngIf="villeForm?.get('nom')?.hasError('required')">Veuillez entrer un nom</mat-error>
    </mat-form-field>






    <mat-form-field class="form-field" appearance="outline">
      <mat-label>Gouvernorat</mat-label>
      <mat-select formControlName="selectedGouvernorat" [(value)]="selectedGouvernorat">
        <mat-option *ngFor="let gouvernorat of gouvernoratList" [value]="gouvernorat">
          {{ gouvernorat.nomg }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="villeForm?.get('selectedGouvernorat')?.hasError('required')">Veuillez sélectionner un Gouvernorat</mat-error>
    </mat-form-field>


    <mat-form-field class="form-field description-field" appearance="outline">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="4" placeholder="Saisissez la description"></textarea>
    </mat-form-field>


    <button mat-raised-button color="primary" class="form-button" type="submit" [disabled]="!villeForm.valid">
      Ajouter
    </button>
    <button mat-raised-button color="secondary" class="form-button" type="button" (click)="cancelAdd()">
      Annuler
    </button>
  </form>
</div>
