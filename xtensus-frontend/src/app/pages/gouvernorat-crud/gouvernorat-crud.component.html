<div class="container">
  <h2 class="page-title">Gouvernorat </h2>

  <a mat-raised-button color="primary" class="custom-button" routerLink="/ajouter-gouvernorat">
    <mat-icon>add</mat-icon> Ajouter Gouvernorat
  </a>

  <!-- List of Gouvernorats -->
  <div class="table-responsive">
    <router-outlet></router-outlet>

    <table id="myDataTable" class="custom-table" datatable [dtOptions]="dtOptions" [dtTrigger]="dtTrigger" class="table table-striped table-bordered">
      <thead class="thead-dark">
        <tr>
          <th>Nom</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let gouvernorat of gouvernorats">
          <td>{{ gouvernorat.nomg }}</td>
          <td>{{ gouvernorat.description }}</td>
          <td>
            <div class="action-buttons">
              <button mat-raised-button color="primary" class="btn-action view-button" (click)="openGouvernoratDetailsPage(gouvernorat.gouverId)">
                <i class="fa fa-eye"></i> Detail
              </button>
              <button mat-raised-button  class="btn-action edit-button" (click)="openUpdateGouvernoratPage(gouvernorat)">
                <i class="fa fa-edit"></i> Modifier
              </button>
              <button mat-raised-button color="warn" class="btn-action delete-button" (click)="openConfirmationDialog(gouvernorat)">
                <i class="fa fa-trash"></i> Supprimer
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
